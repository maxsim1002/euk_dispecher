<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Диспетчер</title>
<style>
:root {
  --primary: #1565C0;
  --primary-dark: #0D47A1;
  --surface: #FFFFFF;
  --bg: #F0F2F5;
  --text: #212121;
  --text-secondary: #616161;
  --border: #E0E0E0;
  --radius: 4px;
  --radius-lg: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.16);
  --header-h: 48px;
  --font: 'Roboto', Arial, sans-serif;

  --status-new-bg: #FFF3E0; --status-new-c: #E65100;
  --status-prog-bg: #E3F2FD; --status-prog-c: #1565C0;
  --status-done-bg: #E8F5E9; --status-done-c: #2E7D32;
  --status-rej-bg: #FFEBEE;  --status-rej-c: #C62828;
  --status-post-bg: #F3E5F5; --status-post-c: #6A1B9A;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; }

/* ── HEADER ── */
.header {
  background: var(--primary);
  color: #fff;
  height: var(--header-h);
  display: flex; align-items: center;
  padding: 0 12px;
  position: sticky; top: 0; z-index: 50;
  box-shadow: var(--shadow);
}
.header-title { font-size: 16px; font-weight: 500; flex: 1; }
.header-actions { display: flex; align-items: center; gap: 6px; }
.header-user { font-size: 12px; opacity: 0.85; }
.hbtn {
  padding: 5px 10px;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: var(--radius);
  background: none; color: #fff;
  font-size: 12px; font-family: var(--font);
  cursor: pointer;
}
.hbtn:hover { background: rgba(255,255,255,0.12); }
.hbtn.admin { background: rgba(255,255,255,0.15); }

/* ── NAV TABS ── */
.nav-tabs {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
}
.nav-tab {
  padding: 10px 16px;
  border: none; background: none;
  font-size: 13px; font-weight: 500;
  font-family: var(--font); color: var(--text-secondary);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
}
.nav-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

/* ── CONTENT ── */
.content { padding: 10px 12px 24px; max-width: 1100px; margin: 0 auto; }
@media (min-width: 768px) { .content { padding: 14px 20px 24px; } }

/* ── STAT BAR (1 строка) ── */
.stat-bar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  display: flex;
  overflow: hidden;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
}
.stat-item {
  flex: 1;
  padding: 7px 4px;
  text-align: center;
  border-right: 1px solid var(--border);
  cursor: default;
  min-width: 0;
}
.stat-item:last-child { border-right: none; }
.stat-num {
  font-size: 18px; font-weight: 700;
  line-height: 1; display: block;
}
.stat-lbl {
  font-size: 10px; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.stat-item.s-all  .stat-num { color: var(--primary); }
.stat-item.s-new  .stat-num { color: #E65100; }
.stat-item.s-prog .stat-num { color: #1565C0; }
.stat-item.s-done .stat-num { color: #2E7D32; }
.stat-item.s-rej  .stat-num { color: #C62828; }
.stat-item.s-post .stat-num { color: #6A1B9A; }

/* ── FILTER PANEL ── */
.filter-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-bottom: 10px;
  box-shadow: var(--shadow);
}
.filter-search-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
}
.filter-search-row input {
  flex: 1; border: none; outline: none;
  font-size: 13px; font-family: var(--font); color: var(--text);
  background: transparent;
}
.filter-search-row input::placeholder { color: #BDBDBD; }
.filter-toggle-row {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px;
  cursor: pointer; user-select: none;
  font-size: 12px; color: var(--text-secondary);
}
.filter-toggle-row:hover { background: var(--bg); }
.toggle-arrow { font-size: 12px; transition: transform 0.15s; }
.toggle-arrow.open { transform: rotate(180deg); }
.filter-grid {
  display: none;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px; padding: 8px 10px 10px;
  border-top: 1px solid var(--border);
}
.filter-grid.open { display: grid; }
@media (min-width: 600px) { .filter-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 900px) { .filter-grid { grid-template-columns: repeat(5, 1fr); } }
.fld { display: flex; flex-direction: column; gap: 3px; }
.fld label { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-secondary); }
.fld select, .fld input {
  padding: 6px 8px; border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 12px;
  font-family: var(--font); color: var(--text);
  background: var(--surface); outline: none;
  width: 100%;
}
.fld select:focus, .fld input:focus { border-color: var(--primary); }
.filter-reset-row {
  grid-column: 1 / -1;
  display: flex; justify-content: flex-end;
}
.btn-text {
  border: none; background: none; cursor: pointer;
  font-size: 12px; font-weight: 500;
  color: var(--primary); font-family: var(--font);
  padding: 4px 8px;
}
.btn-text:hover { text-decoration: underline; }

/* ── TICKETS PANEL ── */
.tickets-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.tickets-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: #FAFAFA;
}
.tickets-toolbar-title { font-size: 13px; font-weight: 500; }
.count-badge {
  background: var(--primary); color: #fff;
  border-radius: 10px; padding: 1px 8px;
  font-size: 11px; font-weight: 700;
}

/* Mobile: список */
.m-list { display: flex; flex-direction: column; }
.m-item {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.m-item:last-child { border-bottom: none; }
.m-item:hover { background: var(--bg); }
.m-item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.m-item-title { font-size: 13px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-item-bottom { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.m-item-meta { font-size: 11px; color: var(--text-secondary); }

/* Desktop: таблица */
.d-table { display: none; width: 100%; border-collapse: collapse; }
@media (min-width: 768px) {
  .m-list { display: none; }
  .d-table { display: table; }
}
.d-table thead { background: #FAFAFA; }
.d-table th {
  padding: 9px 12px; text-align: left;
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.7px;
  color: var(--text-secondary); cursor: pointer;
  border-bottom: 2px solid var(--border);
  user-select: none; white-space: nowrap;
}
.d-table th:hover { color: var(--primary); }
.d-table th.sorted { color: var(--primary); }
.d-table td {
  padding: 9px 12px; font-size: 13px;
  border-bottom: 1px solid var(--border); vertical-align: middle;
}
.d-table tr:last-child td { border-bottom: none; }
.d-table tbody tr { cursor: pointer; }
.d-table tbody tr:hover { background: var(--bg); }
.tid { color: var(--primary); font-weight: 600; font-size: 12px; }

/* Статус-чипы */
.chip {
  display: inline-block; padding: 2px 8px;
  border-radius: 10px; font-size: 11px; font-weight: 600;
  white-space: nowrap;
}
.chip-new      { background: var(--status-new-bg);  color: var(--status-new-c); }
.chip-in_progress { background: var(--status-prog-bg); color: var(--status-prog-c); }
.chip-done     { background: var(--status-done-bg); color: var(--status-done-c); }
.chip-rejected { background: var(--status-rej-bg);  color: var(--status-rej-c); }
.chip-postponed{ background: var(--status-post-bg); color: var(--status-post-c); }

.prio-normal { color: var(--text-secondary); }
.prio-high   { color: #F57C00; font-weight: 600; }
.prio-critical{ color: #C62828; font-weight: 700; }

.empty-row td, .empty-cell {
  text-align: center; padding: 32px; color: #BDBDBD; font-size: 13px;
}

/* ── FAB ── */
.fab {
  position: fixed; bottom: 20px; right: 16px;
  width: 50px; height: 50px;
  background: var(--primary); color: #fff;
  border: none; border-radius: 14px;
  font-size: 28px; cursor: pointer;
  box-shadow: 0 3px 10px rgba(21,101,192,0.4);
  z-index: 40; display: flex; align-items: center; justify-content: center;
}
.fab:hover { background: var(--primary-dark); }
@media (min-width: 768px) { .fab { bottom: 24px; right: 24px; } }

/* ── MODAL ── */
.overlay {
  display: none; position: fixed;
  inset: 0; background: rgba(0,0,0,0.45);
  z-index: 100; align-items: flex-end; justify-content: center;
}
@media (min-width: 600px) { .overlay { align-items: center; } }
.overlay.open { display: flex; }
.modal {
  background: var(--surface);
  width: 100%; max-width: 480px;
  border-radius: 12px 12px 0 0;
  max-height: 92vh; overflow-y: auto;
  padding: 16px 0 20px;
}
@media (min-width: 600px) { .modal { border-radius: 8px; } }
.modal-title {
  font-size: 15px; font-weight: 500;
  padding: 0 16px 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.modal-body { padding: 0 16px; }
.mf { margin-bottom: 12px; }
.mf label {
  display: block; font-size: 11px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.6px;
  color: var(--text-secondary); margin-bottom: 4px;
}
.mf select, .mf input, .mf textarea {
  width: 100%; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 13px; font-family: var(--font); color: var(--text);
  background: var(--surface); outline: none;
}
.mf select:focus, .mf input:focus, .mf textarea:focus { border-color: var(--primary); }
.mf textarea { height: 70px; resize: none; }
.add-row { display: flex; gap: 6px; }
.add-row select { flex: 1; }
.addbtn {
  width: 34px; flex-shrink: 0;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); cursor: pointer;
  font-size: 18px; color: var(--primary);
  display: flex; align-items: center; justify-content: center;
}
.inline-add { display: none; margin-top: 6px; gap: 6px; }
.inline-add.open { display: flex; }
.inline-add input { flex: 1; padding: 7px 9px; font-size: 12px; }
.inline-add button {
  padding: 7px 12px; border: none; border-radius: var(--radius);
  background: var(--primary); color: #fff;
  font-size: 12px; font-family: var(--font); cursor: pointer;
  white-space: nowrap;
}
.modal-footer {
  display: flex; gap: 8px;
  padding: 14px 16px 0;
  border-top: 1px solid var(--border);
  margin-top: 14px;
}
.btn-primary {
  flex: 1; padding: 10px;
  background: var(--primary); color: #fff;
  border: none; border-radius: var(--radius);
  font-size: 13px; font-weight: 500;
  font-family: var(--font); cursor: pointer;
}
.btn-primary:hover { background: var(--primary-dark); }
.btn-cancel {
  padding: 10px 16px;
  background: none; border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 13px;
  font-family: var(--font); cursor: pointer; color: var(--text-secondary);
}

/* ── CHAT ── */
.chat-wrap {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  height: calc(100vh - 130px); min-height: 280px;
}
#chat-messages { flex: 1; overflow-y: auto; padding: 12px; }
.chat-footer {
  padding: 8px 10px; border-top: 1px solid var(--border);
  display: flex; gap: 8px;
}
.chat-footer input {
  flex: 1; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 20px;
  font-size: 13px; font-family: var(--font); outline: none;
}
.chat-footer input:focus { border-color: var(--primary); }
.send-btn {
  padding: 8px 14px; background: var(--primary); color: #fff;
  border: none; border-radius: 20px; cursor: pointer;
  font-size: 13px; font-family: var(--font);
}

/* ── ADMIN ── */
.admin-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow);
  margin-bottom: 10px; overflow: hidden;
}
.admin-card-title {
  padding: 10px 14px; font-size: 13px; font-weight: 500;
  border-bottom: 1px solid var(--border); background: #FAFAFA;
}
.admin-card-body { padding: 12px 14px; }
.utbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.utbl th {
  padding: 7px 10px; background: #FAFAFA;
  text-align: left; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.6px;
  color: var(--text-secondary); white-space: nowrap;
}
.utbl td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
.utbl tr:last-child td { border-bottom: none; }
.role-sel {
  padding: 4px 6px; border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 12px;
  font-family: var(--font); outline: none;
}
.role-sel:focus { border-color: var(--primary); }
.sm-btn {
  padding: 4px 9px; border: none; border-radius: var(--radius);
  cursor: pointer; font-size: 11px; font-weight: 500;
  font-family: var(--font); margin-right: 4px;
}
.sm-btn-ok  { background: #E8F5E9; color: #2E7D32; }
.sm-btn-del { background: #FFEBEE; color: #C62828; }
.admin-form-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
@media (max-width: 480px) { .admin-form-grid { grid-template-columns: 1fr; } }

/* ── SNACKBAR ── */
.snack {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: #323232; color: #fff;
  padding: 10px 18px; border-radius: var(--radius-lg);
  font-size: 13px; white-space: nowrap;
  z-index: 200; display: none; box-shadow: var(--shadow);
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <span class="header-title">Диспетчер</span>
  <div class="header-actions">
    <span class="header-user" id="user-name"></span>
    <button class="hbtn admin" id="admin-btn" style="display:none" onclick="goToAdmin()">Админ</button>
    <button class="hbtn" onclick="logout()">Выйти</button>
  </div>
</div>

<!-- NAV TABS -->
<div class="nav-tabs">
  <button class="nav-tab active" id="nt-tickets" onclick="showTab('tickets',this)">Заявки</button>
  <button class="nav-tab" id="nt-chat" onclick="showTab('chat',this)">Чат</button>
  <button class="nav-tab" id="nt-admin" style="display:none" onclick="showTab('admin',this)">Пользователи</button>
</div>

<div class="content">

  <!-- ─── ЗАЯВКИ ─── -->
  <div id="tab-tickets">

    <!-- СТАТИСТИКА — 1 строка -->
    <div class="stat-bar">
      <div class="stat-item s-all">
        <span class="stat-num" id="st-all">—</span>
        <span class="stat-lbl">Всего</span>
      </div>
      <div class="stat-item s-new">
        <span class="stat-num" id="st-new">—</span>
        <span class="stat-lbl">Новых</span>
      </div>
      <div class="stat-item s-prog">
        <span class="stat-num" id="st-prog">—</span>
        <span class="stat-lbl">В работе</span>
      </div>
      <div class="stat-item s-done">
        <span class="stat-num" id="st-done">—</span>
        <span class="stat-lbl">Выполнено</span>
      </div>
      <div class="stat-item s-rej">
        <span class="stat-num" id="st-rej">—</span>
        <span class="stat-lbl">Отказано</span>
      </div>
      <div class="stat-item s-post">
        <span class="stat-num" id="st-post">—</span>
        <span class="stat-lbl">Перенос</span>
      </div>
    </div>

    <!-- ФИЛЬТРЫ -->
    <div class="filter-panel">
      <div class="filter-search-row">
        <span style="color:#BDBDBD;font-size:14px">⌕</span>
        <input type="text" id="filter-search" placeholder="Поиск по заявкам..." oninput="applyFilters()" />
      </div>
      <div class="filter-toggle-row" onclick="toggleFilters()">
        <span>Фильтры</span>
        <span class="toggle-arrow" id="ftarrow">▾</span>
      </div>
      <div class="filter-grid" id="filter-grid">
        <div class="fld">
          <label>Статус</label>
          <select id="filter-status" onchange="applyFilters()">
            <option value="">Все статусы</option>
            <option value="new">Новая</option>
            <option value="in_progress">В работе</option>
            <option value="done">Выполнено</option>
            <option value="rejected">Отказано</option>
            <option value="postponed">Перенос</option>
          </select>
        </div>
        <div class="fld">
          <label>Тип</label>
          <select id="filter-type" onchange="applyFilters()">
            <option value="">Все типы</option>
            <option value="Водоснабжение">Водоснабжение</option>
            <option value="Канализация">Канализация</option>
            <option value="Вентиляция">Вентиляция</option>
            <option value="Газоснабжение">Газоснабжение</option>
            <option value="Электроснабжение">Электроснабжение</option>
            <option value="Благоустройство">Благоустройство</option>
            <option value="Кровля">Кровля</option>
            <option value="Прочие">Прочие</option>
          </select>
        </div>
        <div class="fld">
          <label>Исполнитель</label>
          <select id="filter-assignee" onchange="applyFilters()">
            <option value="">Все</option>
          </select>
        </div>
        <div class="fld">
          <label>Дата от</label>
          <input type="date" id="filter-date-from" onchange="applyFilters()" />
        </div>
        <div class="fld">
          <label>Дата до</label>
          <input type="date" id="filter-date-to" onchange="applyFilters()" />
        </div>
        <div class="filter-reset-row">
          <button class="btn-text" onclick="resetFilters()">Сбросить фильтры</button>
        </div>
      </div>
    </div>

    <!-- СПИСОК ЗАЯВОК -->
    <div class="tickets-panel">
      <div class="tickets-toolbar">
        <span class="tickets-toolbar-title">Заявки</span>
        <span class="count-badge" id="count-badge">0</span>
      </div>
      <!-- Mobile -->
      <div class="m-list" id="m-list"></div>
      <!-- Desktop -->
      <table class="d-table" id="d-table">
        <thead>
          <tr>
            <th onclick="sortBy('id')" id="th-id">#</th>
            <th onclick="sortBy('title')" id="th-title">Адрес</th>
            <th onclick="sortBy('type')" id="th-type">Тип</th>
            <th onclick="sortBy('created_at')" id="th-date">Создана</th>
            <th onclick="sortBy('status')" id="th-status">Статус</th>
            <th onclick="sortBy('priority')" id="th-prio">Приоритет</th>
            <th onclick="sortBy('assigned_to')" id="th-asn">Исполнитель</th>
          </tr>
        </thead>
        <tbody id="d-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- ─── ЧАТ ─── -->
  <div id="tab-chat" style="display:none">
    <div class="chat-wrap">
      <div id="chat-messages"></div>
      <div class="chat-footer">
        <input type="text" id="chat-input" placeholder="Сообщение..." onkeypress="if(event.key==='Enter')sendMessage()" />
        <button class="send-btn" onclick="sendMessage()">Отправить</button>
      </div>
    </div>
  </div>

  <!-- ─── ПОЛЬЗОВАТЕЛИ ─── -->
  <div id="tab-admin" style="display:none">
    <div class="admin-card">
      <div class="admin-card-title">Список пользователей</div>
      <div style="overflow-x:auto">
        <table class="utbl" id="utbl">
          <thead><tr><th>Имя</th><th>Логин</th><th>Роль</th><th>Новый пароль</th><th>Действия</th></tr></thead>
          <tbody id="u-tbody"></tbody>
        </table>
      </div>
    </div>
    <div class="admin-card">
      <div class="admin-card-title">Новый пользователь</div>
      <div class="admin-card-body">
        <div class="admin-form-grid">
          <div class="mf"><label>Логин</label><input type="text" id="new-username" /></div>
          <div class="mf"><label>Пароль</label><input type="password" id="new-password" /></div>
          <div class="mf" style="grid-column:1/-1"><label>Полное имя</label><input type="text" id="new-fullname" /></div>
          <div class="mf"><label>Роль</label>
            <select id="new-role">
              <option value="executor">Исполнитель</option>
              <option value="dispatcher">Диспетчер</option>
              <option value="admin">Администратор</option>
            </select>
          </div>
          <div style="display:flex;align-items:flex-end">
            <button class="btn-primary" style="padding:8px 16px;flex:0" onclick="createUser()">Создать</button>
          </div>
        </div>
      </div>
    </div>
  </div>

</div><!-- /content -->

<!-- FAB -->
<button class="fab" id="fab-btn" onclick="openModal()">+</button>

<!-- MODAL: Новая заявка -->
<div class="overlay" id="modal">
  <div class="modal">
    <div class="modal-title">Новая заявка</div>
    <div class="modal-body">
      <div class="mf">
        <label>Населённый пункт</label>
        <select id="t-settlement" onchange="loadStreets()">
          <option value="">Выберите...</option>
        </select>
      </div>
      <div class="mf">
        <label>Улица</label>
        <div class="add-row">
          <select id="t-street" onchange="loadHouses()"></select>
          <button class="addbtn" onclick="toggleEl('add-street')">+</button>
        </div>
        <div class="inline-add" id="add-street">
          <input type="text" id="new-street-name" placeholder="Название улицы" />
          <button onclick="addNewStreet()">Добавить</button>
        </div>
      </div>
      <div class="mf">
        <label>Дом</label>
        <div class="add-row">
          <select id="t-house"></select>
          <button class="addbtn" onclick="toggleEl('add-house')">+</button>
        </div>
        <div class="inline-add" id="add-house">
          <input type="text" id="new-house-number" placeholder="Номер дома" />
          <button onclick="addNewHouse()">Добавить</button>
        </div>
      </div>
      <div class="mf">
        <label>Квартира / Помещение</label>
        <input type="text" id="t-apartment" placeholder="Необязательно" />
      </div>
      <div class="mf">
        <label>Тип</label>
        <select id="t-type">
          <option value="Водоснабжение">Водоснабжение</option>
          <option value="Канализация">Канализация</option>
          <option value="Вентиляция">Вентиляция</option>
          <option value="Газоснабжение">Газоснабжение</option>
          <option value="Электроснабжение">Электроснабжение</option>
          <option value="Благоустройство">Благоустройство</option>
          <option value="Кровля">Кровля</option>
          <option value="Прочие">Прочие</option>
        </select>
      </div>
      <div class="mf">
        <label>Описание</label>
        <textarea id="t-desc" placeholder="Описание проблемы..."></textarea>
      </div>
      <div class="mf">
        <label>Приоритет</label>
        <select id="t-priority">
          <option value="normal">Обычный</option>
          <option value="high">Высокий</option>
          <option value="critical">Критический</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="btn-primary" onclick="createTicket()">Создать</button>
    </div>
  </div>
</div>

<div class="snack" id="snack"></div>

<script>
let currentUser = null, allTickets = [], allUsers = [];
let sortField = 'id', sortDir = -1;
let chatWs = null;

const SL = { new:'Новая', in_progress:'В работе', done:'Выполнено', rejected:'Отказано', postponed:'Перенос' };
const PL = { normal:'Обычный', high:'Высокий', critical:'Критический' };
const PO = { critical:3, high:2, normal:1 };

function snack(msg) {
  const el = document.getElementById('snack');
  el.textContent = msg; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2800);
}

function toggleEl(id) {
  document.getElementById(id).classList.toggle('open');
}

function toggleFilters() {
  document.getElementById('filter-grid').classList.toggle('open');
  document.getElementById('ftarrow').classList.toggle('open');
}

async function init() {
  const ud = localStorage.getItem('user');
  if (!ud) { window.location.href = '/'; return; }
  currentUser = JSON.parse(ud);
  document.getElementById('user-name').textContent = currentUser.full_name;
  if (currentUser.role === 'admin') {
    document.getElementById('admin-btn').style.display = '';
    document.getElementById('nt-admin').style.display = '';
  }
  await loadUsers();
  await loadSettlements();
  await loadTickets();
  connectChat();
}

async function loadUsers() {
  const res = await fetch('/auth/users', { credentials:'include' });
  allUsers = await res.json();
  const sel = document.getElementById('filter-assignee');
  allUsers.forEach(u => {
    const o = document.createElement('option');
    o.value = u.id; o.textContent = u.full_name; sel.appendChild(o);
  });
}

async function loadSettlements() {
  const res = await fetch('/tickets/settlements', { credentials:'include' });
  const list = await res.json();
  const sel = document.getElementById('t-settlement');
  sel.innerHTML = '<option value="">Выберите населённый пункт...</option>';
  list.forEach(s => {
    const o = document.createElement('option');
    o.value = s.id; o.textContent = s.name; sel.appendChild(o);
  });
}

async function loadStreets() {
  const id = document.getElementById('t-settlement').value;
  const ss = document.getElementById('t-street');
  const hs = document.getElementById('t-house');
  ss.innerHTML = '<option value="">Улица...</option>';
  hs.innerHTML = '<option value="">Дом...</option>';
  if (!id) return;
  const res = await fetch(`/tickets/streets/${id}`, { credentials:'include' });
  (await res.json()).forEach(s => {
    const o = document.createElement('option');
    o.value = s.id; o.textContent = s.name; ss.appendChild(o);
  });
}

async function loadHouses() {
  const id = document.getElementById('t-street').value;
  const hs = document.getElementById('t-house');
  hs.innerHTML = '<option value="">Дом...</option>';
  if (!id) return;
  const res = await fetch(`/tickets/houses/${id}`, { credentials:'include' });
  (await res.json()).forEach(h => {
    const o = document.createElement('option');
    o.value = h.id; o.textContent = h.number; hs.appendChild(o);
  });
}

async function addNewStreet() {
  const sid = document.getElementById('t-settlement').value;
  const name = document.getElementById('new-street-name').value.trim();
  if (!sid || !name) { snack('Выберите пункт и введите улицу'); return; }
  const res = await fetch('/tickets/add-street', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({settlement_id:parseInt(sid), name}), credentials:'include'
  });
  if (res.ok) {
    document.getElementById('new-street-name').value = '';
    document.getElementById('add-street').classList.remove('open');
    await loadStreets(); snack('Улица добавлена');
  }
}

async function addNewHouse() {
  const sid = document.getElementById('t-street').value;
  const number = document.getElementById('new-house-number').value.trim();
  if (!sid || !number) { snack('Выберите улицу и введите номер'); return; }
  const res = await fetch('/tickets/add-house', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({street_id:parseInt(sid), number}), credentials:'include'
  });
  if (res.ok) {
    document.getElementById('new-house-number').value = '';
    document.getElementById('add-house').classList.remove('open');
    await loadHouses(); snack('Дом добавлен');
  }
}

function getUserName(id) {
  if (!id) return '—';
  const u = allUsers.find(u => u.id === id);
  return u ? u.full_name : '—';
}

async function loadTickets() {
  const res = await fetch('/tickets/', { credentials:'include' });
  if (res.status === 401) { window.location.href = '/'; return; }
  allTickets = await res.json();
  renderStats(); applyFilters();
}

function renderStats() {
  const c = {new:0,in_progress:0,done:0,rejected:0,postponed:0};
  allTickets.forEach(t => { if (c[t.status]!==undefined) c[t.status]++; });
  document.getElementById('st-all').textContent  = allTickets.length;
  document.getElementById('st-new').textContent  = c.new;
  document.getElementById('st-prog').textContent = c.in_progress;
  document.getElementById('st-done').textContent = c.done;
  document.getElementById('st-rej').textContent  = c.rejected;
  document.getElementById('st-post').textContent = c.postponed;
}

function applyFilters() {
  const status   = document.getElementById('filter-status').value;
  const type     = document.getElementById('filter-type').value;
  const assignee = document.getElementById('filter-assignee').value;
  const dfrom    = document.getElementById('filter-date-from').value;
  const dto      = document.getElementById('filter-date-to').value;
  const search   = document.getElementById('filter-search').value.toLowerCase();

  let f = allTickets.filter(t => {
    if (status && t.status !== status) return false;
    if (type && t.type !== type) return false;
    if (assignee && String(t.assigned_to) !== assignee) return false;
    if (dfrom && new Date(t.created_at) < new Date(dfrom)) return false;
    if (dto && new Date(t.created_at) > new Date(dto+'T23:59:59')) return false;
    if (search && !t.title.toLowerCase().includes(search) && !t.description.toLowerCase().includes(search)) return false;
    return true;
  });

  f = f.sort((a,b) => {
    let va = sortField === 'priority' ? PO[a.priority]||0 : a[sortField];
    let vb = sortField === 'priority' ? PO[b.priority]||0 : b[sortField];
    if (va==null) va=''; if (vb==null) vb='';
    return va<vb ? -sortDir : va>vb ? sortDir : 0;
  });

  document.getElementById('count-badge').textContent = f.length;
  renderMobile(f);
  renderDesktop(f);
}

function chip(status) {
  return `<span class="chip chip-${status}">${SL[status]||status}</span>`;
}

function renderMobile(tickets) {
  const el = document.getElementById('m-list');
  if (!tickets.length) { el.innerHTML = '<div class="empty-cell">Заявок не найдено</div>'; return; }
  el.innerHTML = tickets.map(t => {
    const d = new Date(t.created_at).toLocaleString('ru',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    return `<div class="m-item" onclick="location.href='/static/ticket.html?id=${t.id}'">
      <div class="m-item-top">
        <span class="m-item-title">${t.title}</span>
        ${chip(t.status)}
      </div>
      <div class="m-item-bottom">
        <span class="m-item-meta">#${t.id}</span>
        <span class="m-item-meta">${t.type||'Прочие'}</span>
        <span class="m-item-meta">${d}</span>
        <span class="prio-${t.priority}">${PL[t.priority]||t.priority}</span>
      </div>
    </div>`;
  }).join('');
}

function renderDesktop(tickets) {
  const el = document.getElementById('d-tbody');
  if (!tickets.length) { el.innerHTML = '<tr class="empty-row"><td colspan="7">Заявок не найдено</td></tr>'; return; }
  el.innerHTML = tickets.map(t => {
    const d = new Date(t.created_at).toLocaleString('ru',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
    return `<tr onclick="location.href='/static/ticket.html?id=${t.id}'">
      <td class="tid">#${t.id}</td>
      <td style="max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.title}</td>
      <td>${t.type||'Прочие'}</td>
      <td style="color:var(--text-secondary);font-size:12px;white-space:nowrap">${d}</td>
      <td>${chip(t.status)}</td>
      <td><span class="prio-${t.priority}">${PL[t.priority]||t.priority}</span></td>
      <td style="font-size:12px;color:var(--text-secondary)">${getUserName(t.assigned_to)}</td>
    </tr>`;
  }).join('');
}

function sortBy(field) {
  if (sortField===field) sortDir*=-1; else { sortField=field; sortDir=-1; }
  document.querySelectorAll('.d-table th').forEach(th => th.classList.remove('sorted'));
  const map={id:'th-id',title:'th-title',type:'th-type',created_at:'th-date',status:'th-status',priority:'th-prio',assigned_to:'th-asn'};
  if (map[field]) document.getElementById(map[field])?.classList.add('sorted');
  applyFilters();
}

function resetFilters() {
  ['filter-status','filter-type','filter-assignee'].forEach(id=>document.getElementById(id).value='');
  ['filter-date-from','filter-date-to','filter-search'].forEach(id=>document.getElementById(id).value='');
  applyFilters();
}

function showTab(tab, btn) {
  ['tickets','chat','admin'].forEach(t => document.getElementById('tab-'+t).style.display = t===tab?'block':'none');
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('fab-btn').style.display = tab==='tickets' ? 'flex' : 'none';
  if (tab==='admin') loadAdminUsers();
  if (tab==='tickets') loadTickets();
}

function openModal() { document.getElementById('modal').classList.add('open'); }
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  ['t-settlement','t-street','t-house'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('t-apartment').value='';
  document.getElementById('t-type').value='Прочие';
  document.getElementById('t-desc').value='';
  document.getElementById('t-priority').value='normal';
  ['add-street','add-house'].forEach(id=>document.getElementById(id).classList.remove('open'));
}

async function createTicket() {
  const sEl=document.getElementById('t-settlement'), stEl=document.getElementById('t-street'), hEl=document.getElementById('t-house');
  const settlement=sEl.options[sEl.selectedIndex]?.text;
  const street=stEl.options[stEl.selectedIndex]?.text;
  const house=hEl.options[hEl.selectedIndex]?.text;
  const apartment=document.getElementById('t-apartment').value.trim();
  const type=document.getElementById('t-type').value;
  const description=document.getElementById('t-desc').value.trim();
  const priority=document.getElementById('t-priority').value;
  if (!settlement||settlement.includes('...')||!street||street.includes('...')||!house||house.includes('...')) {
    snack('Заполните населённый пункт, улицу и дом'); return;
  }
  if (!description) { snack('Введите описание проблемы'); return; }
  const title=`${settlement}, ${street}, д.${house}${apartment?`, кв.${apartment}`:''}`;
  const res=await fetch('/tickets/',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({title,description,priority,type}),credentials:'include'});
  if (res.ok) { closeModal(); await loadTickets(); snack('Заявка создана'); }
}

// ── ЧАТ ──
function connectChat() {
  const p=window.location.protocol==='https:'?'wss':'ws';
  chatWs=new WebSocket(`${p}://${window.location.host}/ws/chat`);
  chatWs.onmessage=e=>addChatMsg(JSON.parse(e.data));
  chatWs.onclose=()=>setTimeout(connectChat,3000);
  chatWs.onerror=()=>chatWs.close();
}
function addChatMsg(msg) {
  const div=document.getElementById('chat-messages');
  const isMe=currentUser&&msg.user_id===currentUser.id;
  const t=msg.time?new Date(msg.time).toLocaleString('ru',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
  div.innerHTML+=`<div style="margin-bottom:8px;display:flex;flex-direction:column;align-items:${isMe?'flex-end':'flex-start'}">
    <div style="font-size:11px;color:var(--text-secondary);margin-bottom:2px">${msg.full_name} · ${t}</div>
    <div style="background:${isMe?'var(--primary)':'#EEEEEE'};color:${isMe?'#fff':'var(--text)'};padding:8px 12px;border-radius:${isMe?'12px 12px 3px 12px':'12px 12px 12px 3px'};max-width:76%;font-size:13px;line-height:1.4">${msg.text}</div>
  </div>`;
  div.scrollTop=div.scrollHeight;
}
function sendMessage() {
  const inp=document.getElementById('chat-input');
  const text=inp.value.trim();
  if (!text||!chatWs||chatWs.readyState!==1) return;
  chatWs.send(JSON.stringify({text})); inp.value='';
}

// ── ADMIN ──
async function loadAdminUsers() {
  const res=await fetch('/auth/users',{credentials:'include'});
  const users=await res.json();
  document.getElementById('u-tbody').innerHTML=users.map(u=>`<tr>
    <td>${u.full_name}</td><td>${u.username}</td>
    <td><select class="role-sel" onchange="updateRole(${u.id},this.value)">
      <option value="executor"${u.role==='executor'?' selected':''}>Исполнитель</option>
      <option value="dispatcher"${u.role==='dispatcher'?' selected':''}>Диспетчер</option>
      <option value="admin"${u.role==='admin'?' selected':''}>Администратор</option>
    </select></td>
    <td><input type="password" placeholder="Новый пароль" id="pwd-${u.id}" style="width:120px;padding:4px 7px;border:1px solid var(--border);border-radius:var(--radius);font-size:12px"/></td>
    <td><button class="sm-btn sm-btn-ok" onclick="changePwd(${u.id})">Сохранить</button>${u.id!==currentUser.id?`<button class="sm-btn sm-btn-del" onclick="delUser(${u.id},'${u.full_name}')">Удалить</button>`:''}</td>
  </tr>`).join('');
}
async function updateRole(id,role) {
  await fetch(`/auth/users/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({role}),credentials:'include'});
  snack('Роль обновлена');
}
async function changePwd(id) {
  const pwd=document.getElementById('pwd-'+id).value.trim();
  if (!pwd) { snack('Введите пароль'); return; }
  const res=await fetch(`/auth/users/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd}),credentials:'include'});
  if (res.ok) { snack('Пароль изменён'); document.getElementById('pwd-'+id).value=''; }
}
async function delUser(id,name) {
  if (!confirm(`Удалить ${name}?`)) return;
  await fetch(`/auth/users/${id}`,{method:'DELETE',credentials:'include'});
  loadAdminUsers(); snack('Пользователь удалён');
}
async function createUser() {
  const username=document.getElementById('new-username').value.trim();
  const password=document.getElementById('new-password').value.trim();
  const full_name=document.getElementById('new-fullname').value.trim();
  const role=document.getElementById('new-role').value;
  if (!username||!password||!full_name) { snack('Заполните все поля'); return; }
  const res=await fetch('/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password,full_name,role}),credentials:'include'});
  if (res.ok) { snack('Пользователь создан'); ['new-username','new-password','new-fullname'].forEach(id=>document.getElementById(id).value=''); loadAdminUsers(); }
  else snack('Ошибка — логин уже занят');
}

function goToAdmin() { window.location.href='/admin'; }
async function logout() {
  await fetch('/auth/logout',{method:'POST',credentials:'include'});
  localStorage.removeItem('user'); window.location.href='/';
}

init();
setInterval(loadTickets, 30000);
</script>
</body>
</html>
