<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заявка</title>
<style>
:root {
  --primary: #1565C0;
  --primary-dark: #0D47A1;
  --surface: #FFFFFF;
  --bg: #F0F2F5;
  --text: #212121;
  --text-secondary: #616161;
  --border: #E0E0E0;
  --radius: 4px;
  --radius-lg: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.16);
  --header-h: 48px;
  --font: 'Roboto', Arial, sans-serif;

  --status-new-bg: #FFF3E0; --status-new-c: #E65100;
  --status-prog-bg: #E3F2FD; --status-prog-c: #1565C0;
  --status-done-bg: #E8F5E9; --status-done-c: #2E7D32;
  --status-rej-bg: #FFEBEE;  --status-rej-c: #C62828;
  --status-post-bg: #F3E5F5; --status-post-c: #6A1B9A;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; }

/* ── HEADER ── */
.header {
  background: var(--primary); color: #fff;
  height: var(--header-h);
  display: flex; align-items: center; gap: 10px;
  padding: 0 12px;
  position: sticky; top: 0; z-index: 50;
  box-shadow: var(--shadow);
}
.back-btn {
  background: none; border: none; color: #fff;
  font-size: 20px; cursor: pointer; line-height: 1;
  padding: 4px;
}
.header-title { font-size: 15px; font-weight: 500; flex: 1; }

/* ── CONTENT ── */
.content { padding: 10px 12px 32px; max-width: 720px; margin: 0 auto; }
@media (min-width: 768px) { .content { padding: 14px 20px 32px; } }

/* ── CARD ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  margin-bottom: 10px;
  overflow: hidden;
}
.card-title {
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.7px;
  color: var(--text-secondary);
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: #FAFAFA;
}
.card-body { padding: 12px; }

/* ── TICKET HEADER ── */
.ticket-title { font-size: 16px; font-weight: 500; margin-bottom: 6px; line-height: 1.4; }
.ticket-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

/* ── STATUS BUTTONS ── */
.status-row { display: flex; flex-wrap: wrap; gap: 6px; }
.status-btn {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 3px;
  font-size: 12px; font-weight: 500;
  font-family: var(--font); cursor: pointer;
  background: var(--surface); color: var(--text-secondary);
}
.status-btn.active-new      { background: var(--status-new-bg);  color: var(--status-new-c);  border-color: var(--status-new-c); }
.status-btn.active-in_progress { background: var(--status-prog-bg); color: var(--status-prog-c); border-color: var(--status-prog-c); }
.status-btn.active-done     { background: var(--status-done-bg); color: var(--status-done-c); border-color: var(--status-done-c); }
.status-btn.active-rejected { background: var(--status-rej-bg);  color: var(--status-rej-c);  border-color: var(--status-rej-c); }
.status-btn.active-postponed{ background: var(--status-post-bg); color: var(--status-post-c); border-color: var(--status-post-c); }

/* ── META TABLE ── */
.meta-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.meta-table tr { border-bottom: 1px solid var(--border); }
.meta-table tr:last-child { border-bottom: none; }
.meta-table td { padding: 8px 12px; }
.meta-label { color: var(--text-secondary); width: 38%; font-size: 12px; white-space: nowrap; }
.meta-value { font-weight: 500; }
.meta-table select, .meta-table input[type="datetime-local"] {
  padding: 5px 8px; border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 12px;
  font-family: var(--font); color: var(--text); outline: none;
  max-width: 100%;
}
.meta-table select:focus, .meta-table input:focus { border-color: var(--primary); }

.prio-normal  { color: var(--text-secondary); }
.prio-high    { color: #F57C00; font-weight: 600; }
.prio-critical{ color: #C62828; font-weight: 700; }

/* ── REPORT ── */
.report-area {
  width: 100%; padding: 10px;
  border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 13px; font-family: var(--font); color: var(--text);
  resize: vertical; min-height: 100px; outline: none; line-height: 1.5;
}
.report-area:focus { border-color: var(--primary); }

/* ── BUTTONS ── */
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.btn {
  padding: 8px 16px; border: none; border-radius: var(--radius);
  font-size: 13px; font-weight: 500; font-family: var(--font);
  cursor: pointer;
}
.btn-primary  { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline  { background: none; border: 1px solid var(--border); color: var(--text-secondary); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-danger   { background: #FFEBEE; color: #C62828; }

/* ── COMMENTS ── */
.comment {
  border-left: 3px solid var(--primary);
  padding: 8px 10px;
  margin-bottom: 10px;
  background: #F8F9FF;
  border-radius: 0 var(--radius) var(--radius) 0;
}
.comment:last-child { margin-bottom: 0; }
.comment-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
.comment-author { font-size: 12px; font-weight: 600; color: var(--primary); }
.comment-time   { font-size: 11px; color: var(--text-secondary); }
.comment-text   { font-size: 13px; color: var(--text); line-height: 1.4; }
.comment-photos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.comment-photos img {
  width: 72px; height: 72px; object-fit: cover;
  border-radius: var(--radius); cursor: pointer;
  border: 1px solid var(--border);
}

/* ── ADD COMMENT ── */
.add-comment-textarea {
  width: 100%; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 13px; font-family: var(--font);
  resize: none; height: 72px; outline: none; line-height: 1.4;
  margin-bottom: 8px;
}
.add-comment-textarea:focus { border-color: var(--primary); }
.photo-preview { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.photo-preview img { width: 60px; height: 60px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--border); }

/* ── LIGHTBOX ── */
.lightbox {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.88); z-index: 200;
  align-items: center; justify-content: center;
}
.lightbox.open { display: flex; }
.lightbox img { max-width: 95%; max-height: 95%; border-radius: var(--radius); }

/* ── SNACK ── */
.snack {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: #323232; color: #fff;
  padding: 10px 18px; border-radius: var(--radius-lg);
  font-size: 13px; white-space: nowrap;
  z-index: 300; display: none; box-shadow: var(--shadow);
}
</style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="history.back()">←</button>
  <span class="header-title" id="header-title">Заявка #...</span>
</div>

<div class="content">

  <!-- Основная информация -->
  <div class="card">
    <div class="card-title">Информация</div>
    <div class="card-body">
      <div class="ticket-title" id="ticket-title">Загрузка...</div>
      <div class="ticket-desc" id="ticket-desc"></div>
    </div>
  </div>

  <!-- Статус -->
  <div class="card">
    <div class="card-title">Статус</div>
    <div class="card-body">
      <div class="status-row" id="status-row"></div>
    </div>
  </div>

  <!-- Детали -->
  <div class="card">
    <div class="card-title">Детали</div>
    <table class="meta-table">
      <tr>
        <td class="meta-label">Тип</td>
        <td class="meta-value" id="t-type"></td>
      </tr>
      <tr>
        <td class="meta-label">Приоритет</td>
        <td class="meta-value" id="t-priority"></td>
      </tr>
      <tr>
        <td class="meta-label">Создана</td>
        <td class="meta-value" id="t-created"></td>
      </tr>
      <tr>
        <td class="meta-label">Исполнитель</td>
        <td>
          <select id="assignee-select" onchange="updateAssignee()">
            <option value="">— Не назначен —</option>
          </select>
        </td>
      </tr>
      <tr>
        <td class="meta-label">Срок</td>
        <td>
          <input type="datetime-local" id="deadline-input" onchange="updateDeadline()" />
        </td>
      </tr>
    </table>
  </div>

  <!-- Отчёт -->
  <div class="card">
    <div class="card-title">Отчёт о выполнении</div>
    <div class="card-body">
      <textarea class="report-area" id="report-text" placeholder="Опишите что было сделано, какие материалы использованы, время работы..."></textarea>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="saveReport()">Сохранить отчёт</button>
        <button class="btn btn-outline" onclick="exportToCsv()">Экспорт CSV</button>
      </div>
    </div>
  </div>

  <!-- Комментарии -->
  <div class="card">
    <div class="card-title">Хронология</div>
    <div class="card-body">
      <div id="comments-list"></div>
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
        <textarea class="add-comment-textarea" id="comment-text" placeholder="Добавить комментарий..."></textarea>
        <div class="photo-preview" id="photo-preview"></div>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="addComment()">Отправить</button>
          <button class="btn btn-outline" onclick="document.getElementById('camera-input').click()">Камера</button>
          <button class="btn btn-outline" onclick="document.getElementById('gallery-input').click()">Галерея</button>
        </div>
        <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none" multiple onchange="previewPhotos(this)" />
        <input type="file" id="gallery-input" accept="image/*" style="display:none" multiple onchange="previewPhotos(this)" />
      </div>
    </div>
  </div>

</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="document.getElementById('lightbox').classList.remove('open')">
  <img id="lightbox-img" src="" />
</div>

<div class="snack" id="snack"></div>

<script>
const ticketId = new URLSearchParams(window.location.search).get('id');
let currentUser = JSON.parse(localStorage.getItem('user') || '{}');
let ticket = null;
let selectedFiles = [];

const SL = { new:'Новая', in_progress:'В работе', done:'Выполнено', rejected:'Отказано', postponed:'Перенос' };
const PL = { normal:'Обычный', high:'Высокий', critical:'Критический' };

const STATUSES = [
  { key:'new',         label:'Новая' },
  { key:'in_progress', label:'В работе' },
  { key:'done',        label:'Выполнено' },
  { key:'rejected',    label:'Отказано' },
  { key:'postponed',   label:'Перенос' },
];

function snack(msg) {
  const el = document.getElementById('snack');
  el.textContent = msg; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2800);
}

async function init() {
  if (!ticketId) { history.back(); return; }
  await loadTicket();
  await loadUsers();
  await loadComments();
}

async function loadTicket() {
  const res = await fetch(`/tickets/${ticketId}`, { credentials:'include' });
  ticket = await res.json();

  document.getElementById('header-title').textContent = `Заявка #${ticket.id}`;
  document.getElementById('ticket-title').textContent = ticket.title;
  document.getElementById('ticket-desc').textContent = ticket.description;
  document.getElementById('t-type').textContent = ticket.type || 'Прочие';

  const prioEl = document.getElementById('t-priority');
  prioEl.textContent = PL[ticket.priority] || ticket.priority;
  prioEl.className = `prio-${ticket.priority}`;

  document.getElementById('t-created').textContent = new Date(ticket.created_at).toLocaleString('ru');

  if (ticket.report) document.getElementById('report-text').value = ticket.report;
  if (ticket.deadline) {
    document.getElementById('deadline-input').value = new Date(ticket.deadline).toISOString().slice(0,16);
  }
  renderStatuses();
}

function renderStatuses() {
  const isAdmin = currentUser.role === 'admin';
  const isAssignee = ticket.assigned_to === currentUser.id;
  const canChange = isAdmin || isAssignee;

  document.getElementById('status-row').innerHTML = STATUSES.map(s => `
    <button class="status-btn ${ticket.status === s.key ? 'active-'+s.key : ''}"
      onclick="${canChange ? `changeStatus('${s.key}')` : `snack('Нет прав для изменения статуса')`}">
      ${s.label}
    </button>`).join('');
}

async function changeStatus(status) {
  await fetch(`/tickets/${ticketId}`, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({status}), credentials:'include'
  });
  ticket.status = status;
  renderStatuses();
  snack('Статус обновлён');
}

async function loadUsers() {
  const res = await fetch('/auth/users', { credentials:'include' });
  const users = await res.json();
  const sel = document.getElementById('assignee-select');
  users.filter(u => u.role === 'executor' || u.role === 'dispatcher' || u.role === 'admin').forEach(u => {
    const o = document.createElement('option');
    o.value = u.id; o.textContent = u.full_name;
    if (u.id === ticket.assigned_to) o.selected = true;
    sel.appendChild(o);
  });
  if (currentUser.role !== 'admin') sel.disabled = true;
}

async function updateAssignee() {
  const assigned_to = parseInt(document.getElementById('assignee-select').value) || null;
  await fetch(`/tickets/${ticketId}`, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({assigned_to}), credentials:'include'
  });
  snack('Исполнитель назначен');
}

async function updateDeadline() {
  const deadline = document.getElementById('deadline-input').value;
  await fetch(`/tickets/${ticketId}`, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({deadline}), credentials:'include'
  });
  snack('Срок установлен');
}

async function saveReport() {
  const report = document.getElementById('report-text').value;
  await fetch(`/tickets/${ticketId}`, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({report}), credentials:'include'
  });
  snack('Отчёт сохранён');
}

async function loadComments() {
  const res = await fetch(`/tickets/${ticketId}/comments`, { credentials:'include' });
  const comments = await res.json();
  const list = document.getElementById('comments-list');
  if (!comments.length) {
    list.innerHTML = '<div style="color:var(--text-secondary);font-size:13px">Комментариев пока нет</div>';
    return;
  }
  list.innerHTML = comments.map(c => `
    <div class="comment">
      <div class="comment-header">
        <span class="comment-author">${c.full_name}</span>
        <span class="comment-time">${new Date(c.created_at).toLocaleString('ru')}</span>
      </div>
      <div class="comment-text">${c.text}</div>
      ${c.photos && c.photos.length ? `<div class="comment-photos">
        ${c.photos.map(p=>`<img src="/uploads/${p}" onclick="openLightbox('/uploads/${p}')" />`).join('')}
      </div>` : ''}
    </div>`).join('');
}

function previewPhotos(input) {
  selectedFiles = Array.from(input.files);
  const preview = document.getElementById('photo-preview');
  preview.innerHTML = '';
  selectedFiles.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.createElement('img');
      img.src = e.target.result;
      preview.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
}

async function addComment() {
  const text = document.getElementById('comment-text').value.trim();
  if (!text) { snack('Введите комментарий'); return; }
  const formData = new FormData();
  formData.append('text', text);
  selectedFiles.forEach(f => formData.append('photos', f));
  await fetch(`/tickets/${ticketId}/comments`, {
    method:'POST', body: formData, credentials:'include'
  });
  document.getElementById('comment-text').value = '';
  document.getElementById('photo-preview').innerHTML = '';
  selectedFiles = [];
  await loadComments();
  snack('Комментарий добавлен');
}

function exportToCsv() {
  const report = document.getElementById('report-text').value;
  const rows = [
    ['Поле','Значение'],
    ['Номер заявки', ticket.id],
    ['Заголовок', ticket.title],
    ['Описание', ticket.description],
    ['Тип', ticket.type],
    ['Статус', SL[ticket.status] || ticket.status],
    ['Приоритет', PL[ticket.priority] || ticket.priority],
    ['Создана', new Date(ticket.created_at).toLocaleString('ru')],
    ['Срок', ticket.deadline ? new Date(ticket.deadline).toLocaleString('ru') : '—'],
    ['Отчёт', report],
  ];
  let csv = '\uFEFF';
  rows.forEach(row => { csv += row.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';') + '\n'; });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8;'}));
  a.download = `Заявка_${ticket.id}.csv`;
  a.click();
}

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}

init();
</script>
</body>
</html>
