<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Диспетчер — Вход</title>
<style>
/* ── ОБЩИЕ ПЕРЕМЕННЫЕ (единый стиль для всех страниц) ── */
:root {
  --primary: #1565C0;
  --primary-dark: #0D47A1;
  --surface: #FFFFFF;
  --bg: #F0F2F5;
  --text: #212121;
  --text-secondary: #616161;
  --border: #E0E0E0;
  --radius: 4px;
  --radius-lg: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.16);
  --header-h: 48px;
  --font: 'Roboto', Arial, sans-serif;

  --status-new-bg: #FFF3E0; --status-new-c: #E65100;
  --status-prog-bg: #E3F2FD; --status-prog-c: #1565C0;
  --status-done-bg: #E8F5E9; --status-done-c: #2E7D32;
  --status-rej-bg: #FFEBEE;  --status-rej-c: #C62828;
  --status-post-bg: #F3E5F5; --status-post-c: #6A1B9A;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font);
  background: var(--primary-dark);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
}
.login-wrap {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  width: 90%; max-width: 360px;
  overflow: hidden;
}
.login-header {
  background: var(--primary);
  color: #fff;
  padding: 20px 24px;
  text-align: center;
}
.login-header h1 { font-size: 18px; font-weight: 500; letter-spacing: 0.3px; }
.login-header p { font-size: 12px; opacity: 0.8; margin-top: 3px; }
.login-body { padding: 20px 24px 24px; }
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 11px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.7px;
  color: var(--text-secondary);
  margin-bottom: 5px;
}
.field input {
  width: 100%; padding: 9px 11px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 14px; font-family: var(--font);
  color: var(--text); outline: none;
  transition: border-color 0.15s;
}
.field input:focus { border-color: var(--primary); }
.btn-primary {
  width: 100%; padding: 10px;
  background: var(--primary); color: #fff;
  border: none; border-radius: var(--radius);
  font-size: 14px; font-weight: 500;
  font-family: var(--font); cursor: pointer;
  margin-top: 4px;
  transition: background 0.15s;
}
.btn-primary:hover { background: var(--primary-dark); }
.error-msg {
  background: #FFEBEE; color: #C62828;
  padding: 9px 12px;
  border-radius: var(--radius);
  font-size: 13px;
  margin-top: 12px;
  display: none;
}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-header">
    <h1>Диспетчер</h1>
    <p>Система аварийных заявок</p>
  </div>
  <div class="login-body">
    <div class="field">
      <label>Логин</label>
      <input type="text" id="username" placeholder="Введите логин" autocomplete="username" />
    </div>
    <div class="field">
      <label>Пароль</label>
      <input type="password" id="password" placeholder="Введите пароль" autocomplete="current-password" />
    </div>
    <button class="btn-primary" onclick="login()">Войти</button>
    <div class="error-msg" id="error">Неверный логин или пароль</div>
  </div>
</div>
<script>
async function login() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errorDiv = document.getElementById('error');
  errorDiv.style.display = 'none';
  try {
    const response = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
      credentials: 'include'
    });
    if (response.ok) {
      const user = await response.json();
      localStorage.setItem('user', JSON.stringify(user));
      window.location.href = '/static/dashboard.html';
    } else {
      errorDiv.style.display = 'block';
    }
  } catch (e) {
    errorDiv.style.display = 'block';
  }
}
document.addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
